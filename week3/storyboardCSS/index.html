<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./styles.css" />
    <title>StoryBoard CSS Exercise</title>
</head>
<body>
    <section>
        <div id="adWrapper">

            <div id="adbannerScene1">     <!-- ad scene 1 start -->
                <div id="adbannerScene1Background">
                    <img src="./img/lawrence-chismorie-unsplash.jpg" alt="cruise passengers" />
                </div>    
                <div id="adbannerScene1Line1">Homeward Bound?</div>  
                <div id="adbannerScene1Line2">Artistic</div>
                <div id="adbannerScene1Line3">Odessey?</div>
                <div id="adbannerScene1Line4">Vinyard</div>
                <div id="adbannerScene1Line5">Voyage?</div>
            </div>      <!-- ad scene 1 end -->

            <div id="adbannerScene2">     <!-- ad scene 2 start -->
                <div id="adbannerScene2Background">
                    <img src="./img/alonso-reyes-unsplash.jpg" alt="cruise ship sailing along the ocean" />
                </div>
                <div id="adbannerScene2Line1">EVERY JOURNEY HAS A STORY.</div>
                <div id="adbannerScene2Line2">BOOK YOURS</div>
            </div>      <!-- ad scene 2 end -->
            
        </div>
    </section>
</body>
</html>
